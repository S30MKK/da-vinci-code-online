<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e2a38">
<title>达芬奇密码 · 在线对战</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/styles.css?v=20260825k">
</head>
<body>
<div id="app">

  <!-- ======== 大厅 ======== -->
  <section id="view-lobby" class="view">
    <header class="hero">
      <h1>达芬奇密码</h1>
      <p class="sub">多人联机 · 手机/电脑互通 · 免安装即玩 · v2.9 大屏自适应</p>
    </header>
    <div class="panel" id="lobby-login">
      <label for="nickname">你的昵称</label>
      <input id="nickname" maxlength="12" placeholder="输入昵称，例如：小明">
      <button class="btn primary block" id="btn-create">创建房间</button>
      <div class="split">
        <input id="join-code" maxlength="6" inputmode="numeric" placeholder="房间码（6 位）">
        <button class="btn" id="btn-join">加入房间</button>
      </div>
      <div class="split">
        <input id="spec-code" maxlength="6" inputmode="numeric" placeholder="观战：房间码">
        <button class="btn ghost" id="btn-spectate">观战</button>
      </div>
      <button class="btn link" id="btn-rules">📖 玩法说明</button>
    </div>
    <div class="panel stats-panel" id="lobby-stats" hidden>
      <h3 id="stats-name"></h3>
      <div class="stat-grid" id="stats-grid"></div>
      <h4>最近表现（综合分走势）</h4>
      <div id="stats-chart" class="chart"></div>
      <div class="row" id="stats-backup-row">
        <button class="btn small ghost" id="btn-stats-download">⬇ 下载战绩备份</button>
        <button class="btn small ghost" id="btn-stats-upload">⬆ 上传恢复</button>
        <input type="file" id="stats-file" accept=".json,application/json" hidden>
      </div>
      <p class="hint">服务器重置后，用「上传恢复」把备份传回去即可找回战绩。</p>
    </div>
  </section>

  <!-- ======== 房间 ======== -->
  <section id="view-room" class="view" hidden>
    <header class="topbar">
      <button class="btn ghost" id="btn-room-leave">← 离开</button>
      <div class="room-code">房间 <b id="room-code"></b></div>
      <button class="btn" id="btn-copy-code">复制</button>
    </header>
    <div class="room-body">
      <div class="panel">
        <h3>玩家（<span id="seat-count"></span>/4）</h3>
        <div id="seat-list" class="seat-list"></div>
        <div class="row" id="host-controls" hidden>
          <button class="btn" id="btn-add-bot">＋ 添加机器人</button>
          <button class="btn primary" id="btn-start">开始对局</button>
        </div>
        <div class="row" id="spec-controls" hidden>
          <span class="label">观战视角：</span>
          <button class="btn small" id="btn-view-all">看到暗牌</button>
          <button class="btn small" id="btn-view-public">仅公开信息</button>
        </div>
        <div class="row" id="replay-row" hidden>
          <button class="btn small ghost" id="btn-room-replays">🎬 最近回放</button>
        </div>
        <p class="hint" id="room-hint"></p>
      </div>
    </div>
    <div class="chatbox" id="room-chat"></div>
  </section>

  <!-- ======== 对局桌 ======== -->
  <section id="view-game" class="view" hidden>
    <header class="topbar">
      <div class="turn-banner" id="turn-banner"></div>
      <div class="room-code">房间 <b id="game-room-code"></b></div>
    </header>
    <div id="table-wrap">
      <div id="opponents" class="opponents"></div>
      <div id="center-area" class="center-area">
        <div class="pile" id="draw-pile"><span id="pile-count">0</span></div>
        <div id="action-area" class="action-area"></div>
      </div>
      <div id="own-area" class="own-area">
        <div class="seat-label" id="own-label"></div>
        <div id="own-row" class="tile-row"></div>
        <div class="row-hint">← 小 · 大 →</div>
      </div>
    </div>
    <div class="chatbox" id="game-chat"></div>
  </section>

  <!-- ======== 回放 ======== -->
  <section id="view-replay" class="view" hidden>
    <header class="topbar replay-top">
      <button class="btn ghost" id="btn-replay-back">← 返回</button>
      <div class="room-code">对局回放</div>
      <div class="replay-controls">
        <button class="btn small" id="rp-first" title="开头">⏮</button>
        <button class="btn small" id="rp-prev" title="上一步">◀</button>
        <button class="btn small" id="rp-next" title="下一步">▶</button>
        <button class="btn small" id="rp-last" title="结尾">⏭</button>
        <button class="btn small" id="rp-auto" title="自动播放">自动</button>
      </div>
    </header>
    <div id="replay-body" class="replay-body"></div>
    <div id="replay-log" class="replay-log"></div>
  </section>

</div>

<div id="debug-badge" style="position:fixed;top:8px;left:8px;z-index:9999;background:#222;color:#fff;font-size:12px;padding:4px 8px;border-radius:4px;max-width:70vw;word-break:break-all;">v2.9 加载中…</div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="js/client.js?v=20260825k"></script>
</body>
</html>
